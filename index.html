<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>落ち物パズルゲーム・蘇</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <section id="screen-title" class="screen" data-screen="title">
      <h1>落ち物パズルゲーム・蘇</h1>
      <p class="blurb">数字と記号を並べて数式をつくり、スコアを稼ごう。</p>
      <button type="button" id="btn-start">スタート</button>
    </section>

    <section id="screen-playing" class="screen hidden" data-screen="playing" hidden>
      <div id="play-layout">
        <div id="hud-left">
          <div id="overlay">
            <span id="score">Score: 0</span>
            <span id="level">Level: 1</span>
          </div>
        </div>
        <div id="game-container"></div>
        <div id="hud-right">
          <div id="next-panel" aria-label="次のブロック">
            <div class="next-title">Next</div>
            <div id="next-blocks">
              <span id="next-pivot" class="next-cell"></span>
              <span id="next-secondary" class="next-cell"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="screen-result" class="screen hidden" data-screen="result" hidden>
      <h2>ゲームオーバー</h2>
      <p id="result-score">Score: 0</p>
      <button type="button" id="btn-retry">もう一度</button>
    </section>
  </div>
  <script type="module" src="dist/main.js"></script>
</body>
</html>
