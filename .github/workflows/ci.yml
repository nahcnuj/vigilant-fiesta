name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - name: Unit + integration tests with coverage
        run: deno test --allow-read --allow-net --coverage=cov src/ tests/integration/
      - name: Generate coverage report
        env:
          NO_COLOR: "1"
        run: |
          deno coverage cov --lcov > coverage.lcov
          deno coverage cov > coverage.txt
          cat coverage.txt
      - name: Comment coverage to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('coverage.txt', 'utf8')
              .replace(/\u001b\[[0-9;]*m/g, '')
              .trim();
            const body = [
              '<!-- coverage-report -->',
              '### Coverage',
              '',
              summary,
              '',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.includes('<!-- coverage-report -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.lcov
            coverage.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - name: Build bundle
        run: deno task build
      - name: Stage site
        run: |
          mkdir -p _site/dist
          cp index.html style.css _site/
          cp dist/main.js _site/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ver.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          VER=$(jq -r '.imports.playwright // empty' deno.json | sed -E 's/^npm:playwright@//')
          if [ -z "$VER" ]; then
            echo "playwright version not found in deno.json imports" >&2
            exit 1
          fi
          IMAGE="mcr.microsoft.com/playwright:v${VER}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: [playwright-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.playwright-version.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip
        run: apt-get update && apt-get install -y unzip
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Place site files
        run: cp -a _site/. .
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - name: E2E tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -eux
          CHROME_PATH="$(find /ms-playwright -type f -path '*/chrome-linux/chrome' 2>/dev/null | head -n 1 || true)"
          if [ -z "$CHROME_PATH" ]; then
            CHROME_PATH="$(find /ms-playwright -type f -name chrome 2>/dev/null | head -n 1 || true)"
          fi
          echo "CHROME_PATH=${CHROME_PATH}"
          ls -la /ms-playwright || true
          export CHROME_PATH
          deno task test:e2e
