name: CI

on:
  push:
    branches: [ main, impl ]
  pull_request:
    branches: [ main, impl ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - name: Run unit tests with coverage
        run: deno test --allow-read --allow-net --coverage=cov
      - name: Generate coverage report
        run: deno coverage cov --lcov > coverage.lcov
      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const cov = fs.readFileSync('coverage.lcov', 'utf8');
            const body = `### 📊 Coverage Report\n\`\`\`lcov\n${cov}\n\`\`\``;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${context.payload.pull_request.body || ''}\n\n${body}`
            });
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.lcov
      - name: Post coverage to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const cov = fs.readFileSync('coverage.lcov', 'utf8');
            const body = `### 📊 Coverage Report\n\`\`\`lcov\n${cov}\n\`\`\``;
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${context.payload.pull_request.body || ''}\n\n${body}`
            });
