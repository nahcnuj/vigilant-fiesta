name: CI

on:
  push:
    branches: [ main, impl ]
  pull_request:
    branches: [ main, impl ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - name: Run unit tests with coverage
        run: deno test --allow-read --allow-write --allow-run --allow-net --coverage=cov
      - name: Generate coverage report and enforce ≥90%
        env:
          NO_COLOR: "1"
        run: |
          deno coverage cov --lcov > coverage.lcov
          deno coverage cov > coverage.txt
          deno run --allow-read --allow-write scripts/coverage_report.ts coverage.txt coverage.md
      - name: Comment coverage to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '<!-- coverage-report -->\n' +
              fs.readFileSync('coverage.md', 'utf8').trim() + '\n';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.includes('<!-- coverage-report -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.lcov
            coverage.txt
            coverage.md
