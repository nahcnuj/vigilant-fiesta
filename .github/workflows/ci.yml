name: CI

on:
  push:
    branches: [ main, impl ]
  pull_request:
    branches: [ main, impl ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "1.x"
      - name: Run unit tests
        run: deno test --allow-read --allow-net
