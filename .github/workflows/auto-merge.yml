name: Owner-approved auto-merge

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  enable:
    uses: conahcnuj/conahcnuj/.github/workflows/owner-approved-auto-merge.yml@e1e6acc3e44b6013503eb16624e1eca5d38f4e8b
    with:
      repository: ${{ github.repository }}
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
