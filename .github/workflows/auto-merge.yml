name: Owner-approved auto-merge

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  enable:
    uses: conahcnuj/conahcnuj/.github/workflows/owner-approved-auto-merge.yml@3158e4fe73dd8dfd60ee217cee2ac321f2aac4b0
    with:
      repository: ${{ github.repository }}
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
